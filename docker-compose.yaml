services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: order-service
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: order_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: sh -c "python manage.py makemigrations && python manage.py migrate && (python myapp/consumer.py &) && python manage.py runserver 0.0.0.0:8001"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservices-net

  inventory-service:
    build:
      context: .
      dockerfile: inventory_service/Dockerfile
    container_name: inventory-service
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: sh -c "python manage.py makemigrations && python manage.py migrate && (python service/consumer.py &) && python manage.py runserver 0.0.0.0:8002"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  payment-service:
    build:
      context: .
      dockerfile: payment_service/Dockerfile
    container_name: payment-service
    ports:
      - "8003:8003"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: payment_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: sh -c "python manage.py makemigrations && python manage.py migrate && (python payments/consumer.py &) && python manage.py runserver 0.0.0.0:8003"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: notification-service
    ports:
      - "8004:8004"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: sh -c "python manage.py makemigrations && python manage.py migrate && (python notifications/consumer.py &) && python manage.py runserver 0.0.0.0:8004"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    container_name: user-service
    ports:
      - "8005:8005"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8005"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservices-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: django-insecure-yi-hon&3h3!k9h+g34j%0xqqxr_%r-t&6j5)a0_am5dm(*261g
      JWT_ALGORITHM: HS256
    depends_on:
      - user-service
      - order-service
      - inventory-service
      - payment-service
      - notification-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  pgdata:
